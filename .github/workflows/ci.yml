name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"   # weekly: catch newly published vulnerabilities

jobs:
  go:
    name: unit, differential, soak (race + leak checks), fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: make pytest
      - run: make fuzz FUZZTIME=30s
      - run: make build

  vulncheck:
    name: known vulnerabilities (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  differential:
    name: goldens regenerated from real Celery (version matrix)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports: ["5672:5672"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: wait for RabbitMQ
        run: for i in $(seq 60); do nc -z 127.0.0.1 5672 && break; sleep 2; done; sleep 10
      - name: every supported version must reproduce the committed goldens byte for byte
        run: make matrix
      - name: Python beat soak reference (small) must reproduce
        run: make soak-check

  integration:
    name: integration + failure injection + shadow (${{ matrix.broker }}, celery ${{ matrix.celery }}, dcb ${{ matrix.dcb }}, USE_TZ ${{ matrix.use_tz || '1' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        broker: [redis, amqp]
        celery: ["5.7.0"]
        dcb: ["2.9.0"]
        include:
          - {broker: redis, celery: "5.7.0", dcb: "2.8.1"}
          # Redis Sentinel: a replica + 3 Sentinels, graceful failover and master crash
          - {broker: sentinel, celery: "5.7.0", dcb: "2.9.0"}
          # USE_TZ=False: Django still makes `timestamp with time zone`
          # columns on PostgreSQL and exchanges naive values in TIME_ZONE
          - {broker: amqp, celery: "5.7.0", dcb: "2.9.0", use_tz: "0"}
    env:
      BROKER: ${{ matrix.broker }}
      USE_TZ: ${{ matrix.use_tz || '1' }}
      CELERY_VERSION: ${{ matrix.celery }}
      DCB_VERSION: ${{ matrix.dcb }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: make build images
      - run: pip install pytest
      - working-directory: tests/integration
        run: |
          if [ "$USE_TZ" = 0 ]; then
            # the other suites create rows with last_run_at NULL, whose first
            # run Python beat itself places TIME_ZONE's offset late with
            # USE_TZ=False (naive date_changed read as UTC)
            python -m pytest -x -q test_naive.py
          elif [ "$BROKER" = sentinel ]; then
            # test_failures stops "redis" to simulate a broker outage; with
            # Sentinel that is a failover, covered by test_sentinel.py
            python -m pytest -x -q test_integration.py test_cron.py test_sentinel.py
          else
            python -m pytest -x -q test_integration.py test_cron.py test_failures.py test_shadow.py
          fi
      - name: without django-celery-beat installed
        if: matrix.broker == 'redis' && matrix.dcb == '2.9.0'
        env:
          DCB_VERSION: none
          WITH_DCB: "0"
        run: |
          tests/integration/build.sh
          cd tests/integration && python -m pytest -x -q test_nodcb.py test_cron.py
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.broker }}-${{ matrix.celery }}-${{ matrix.dcb }}-tz${{ matrix.use_tz || '1' }}
          path: tests/integration/.artifacts/*.log
