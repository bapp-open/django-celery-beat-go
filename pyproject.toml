[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "django-gobeat"
version = "0.1.0"
description = "Companion Django app for gobeat, a Go replacement for celery beat (django-celery-beat DatabaseScheduler)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "Django>=4.2",
    "celery>=5.7,<5.8",
]

[tool.setuptools.packages.find]
include = ["django_gobeat*"]
